function translate(input){

 const content=raw.trim();if(!content)return raw;
 let output=TH[content];
 if(output===undefined){for(const [rule,formatter] of patterns){const match=content.match(rule);if(match){output=formatter(match);break}}}
 if(output===undefined&&content.includes(' · ')){
  let parts=content.split(' · '),localized=parts.map(x=>translate(x));
  if(localized.some((x,i)=>x!==parts[i]))output=localized.join(' · ');

 if(output===undefined&&content.includes(' or ')){
  let parts=content.split(' or '),localized=parts.map(x=>translate(x));
  if(localized.some((x,i)=>x!==parts[i]))output=localized.join(' หรือ ');

}

}

function historyValue(v){if(v==null||v==='')return '<span>Not recorded</span>';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return `<span data-translate="no">${dateDisplay(v)}</span>`;if(['Active','In service','Unavailable','Sold / retired','Yes','No','Verified','Resolved'].includes(v))return `<span>${esc(v)}</span>`;return `<span data-translate="no">${esc(v)}</span>`}
function historyChanges(changes){if(!changes||!changes.length)return '<span>Not recorded</span>';return changes.map(c=>{const field=`<span>${esc(c.field)}</span>`;if(c.from==null)return `<span class="change-line">${field}${historyValue(c.to)}</span>`;if(c.to==null)return `<span class="change-line">${field}${historyValue(c.from)}</span>`;return `<span class="change-line">${field}${historyValue(c.from)}<span>→</span>${historyValue(c.to)}</span>`}).join('')}
function historyRecord(row){const labels={vehicle:'Vehicle',service:'Maintenance record',rule:'Reminder rule',odometer:'Mileage reading',downtime:'Downtime record',issue:'Data issue',config:'Tracking start',fleet:'Fleet backup'};const label=`<span>${labels[row.subjectType]||row.subjectType}</span>`;if(row.subjectType==='vehicle')return `<td>${label} <b data-translate="no">${esc(row.subjectId||'')}</b> <small data-translate="no">${esc(row.detail||'')}</small></td>`;if(row.subjectType==='rule')return `<td>${label} <span>${esc(row.category||row.subjectId||'')}</span></td>`;if(row.subjectType==='service'||row.subjectType==='odometer'||row.subjectType==='downtime')return `<td>${label} <b data-translate="no">${esc(row.detail||'')}</b>${row.category?` <span>${esc(row.category)}</span>`:''}</td>`;if(row.subjectType==='issue')return `<td>${label} <span data-translate="no">${esc(row.detail||'')}</span></td>`;return `<td>${label}</td>`}
function renderHistory(){const actions={created:'Added',updated:'Updated',deleted:'Removed',resolved:'Resolved',replaced:'Replaced'};const when=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString(i18n.localeDate(),{dateStyle:'medium',timeStyle:'short'})};return pageHeader('AUDIT TRAIL','Change history','Who added, edited, or removed each record.')+`<div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>When</th><th>Person</th><th>Action</th><th>Record</th><th>Changes</th></tr></thead><tbody>${activityLog.map(row=>`<tr><td data-translate="no">${when(row.at)}</td><td>${row.username==='system'?'<b>System</b>':`<b data-translate="no">${esc(row.name)}</b><small data-translate="no">${esc(row.username)}</small>`}</td><td><span>${actions[row.action]||row.action}</span></td>${historyRecord(row)}<td>${historyChanges(row.changes)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">${activityLoading?'Loading change history':'No changes have been recorded yet.'}</td></tr>`}</tbody></table></div></div>`}
async function clickHandler(e){let btn=e.target.closest('button');if(!btn){if(e.target.dataset.backdrop){modal=null;renderModal()}return}if(btn.dataset.page){setPage(btn.dataset.page);return}let action=btn.dataset.action,id=btn.dataset.id;if(!action)return;if((action==='reset'||action==='import-json')&&!(window.FLEET_USER&&window.FLEET_USER.admin)){toast('Only an administrator can do that');return}
switch(action){case 'menu':sidebarOpen=!sidebarOpen;render();break;case 'new-vehicle':openModal('vehicle-form');break;case 'mileage':openModal('mileage-form',{vehicleId:id});break;case 'edit-vehicle':openModal('vehicle-form',{vehicleId:id});break;case 'view':openModal('view',{vehicleId:id});break;case 'service':if(['Insurance','Road tax','Registration','Vehicle inspection'].includes(btn.dataset.category)){openModal('view',{vehicleId:id});break}openModal('service-form',{vehicleId:id||undefined,category:btn.dataset.category});break;case 'edit-service':openModal('service-form',{serviceId:id});break;case 'delete-service':{let s=db.services.find(x=>x.id===id);if(!s)return;if(!confirm(`Delete the ${s.category} entry for ${s.vehicleId}? This will recalculate maintenance alerts.`))return;if(!await api('DELETE','/api/services/'+encodeURIComponent(id)))return;render();toast('Maintenance entry deleted');break}
case 'new-rule':openModal('rule-form');break;case 'edit-rule':openModal('rule-form',{ruleId:id});break;case 'downtime':openModal('downtime-form',{vehicleId:id});break;case 'delete-mileage':{let l=db.odometerLogs.find(x=>x.id===id);if(!l)return;if(!confirm('Delete this odometer history entry?'))return;if(!await api('DELETE','/api/odometer/'+encodeURIComponent(id)))return;render();toast('Odometer reading deleted');break}case 'delete-downtime':if(confirm('Delete this vehicle downtime record?')){if(!await api('DELETE','/api/downtime/'+encodeURIComponent(id)))return;render();toast('Downtime record deleted')}break;
case 'vehicle-tab':vehicleTab=btn.dataset.tab;renderModal();break;case 'resolve-issue':{if(!await api('POST','/api/issues/'+encodeURIComponent(id)+'/resolve'))return;render();toast('Import issue marked reviewed');break}
case 'close-modal':modal=null;renderModal();break;case 'notify':enableNotification();break;case 'start-tracking':if(confirm('Start tracking availability from today? Only downtime events that are recorded can reduce the calculated availability.')){if(!await api('PATCH','/api/config',{trackingStart:localToday()}))return;render();toast('Downtime tracking started')}break;
case 'export-vehicles':downloadCSV('bp_fleet_vehicles.csv',vehicleCSV());toast('Vehicle CSV exported');break;case 'export-mileage':downloadCSV('bp_fleet_odometer.csv',mileageCSV());toast('Odometer CSV exported');break;case 'export-services':downloadCSV('bp_fleet_maintenance.csv',serviceCSV());toast('Maintenance CSV exported');break;case 'export-report':downloadCSV('bp_fleet_cost_report.csv',reportCSV());toast('Cost report CSV exported');break;case 'export-json':downloadText('bp_fleet_backup_'+localToday()+'.json',JSON.stringify({app:'BP Fleet Management System',schemaVersion:1,exportedAt:new Date().toISOString(),data:db},null,2),'application/json;charset=utf-8');toast('Full JSON backup downloaded');break;case 'import-json':restoreBackup();break;
case 'logout':{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-TOKEN':window.CSRF||'','Accept':'application/json'}});location.href='/login';break}case 'reset':if(confirm('WARNING: Reset the shared database to the original Excel import? Export a backup first.')&&confirm('Are you sure? This will delete all newly entered vehicles, expenses and rules for every user.')){const data=clone(ORIGINAL_SEED);data.downtime=data.downtime||[];data.odometerLogs=data.odometerLogs||[];data.issues=data.issues||[];data.metadata=data.metadata||{};data.config={trackingStart:null};if(!await api('POST','/api/fleet/replace',{data}))return;setPage('dashboard');toast('Original Excel data restored')}break;
}}
async function changeHandler(e){let t=e.target;if(t.id==='language-select'){i18n.setLanguage(t.value);render();return}if(t.id==='fleet-search')return;if(t.id==='fleet-status'){fleetStatus=t.value;render()}else if(t.id==='alert-filter'){alertFilter=t.value;render()}else if(t.id==='service-vehicle'){serviceVehicle=t.value;render()}else if(t.id==='service-category'){serviceFilter=t.value;render()}else if(t.id==='report-range'){reportRange=t.value;render()}else if(t.dataset.ruleToggle){let r=db.rules.find(x=>x.id===t.dataset.ruleToggle);if(r){if(t.checked&&!r.kmInterval&&!r.daysInterval){toast('Set an interval before enabling this rule');t.checked=false;return}const next=t.checked;if(!await api('PATCH','/api/rules/'+encodeURIComponent(r.id),{active:next})){t.checked=!next;return}render();toast('Maintenance monitoring updated')}}}
function inputHandler(e){if(e.target.id==='fleet-search'){query=e.target.value;const pos=e.target.selectionStart;let tbody=document.querySelector('.content .table tbody'),summary=document.querySelector('.toolbar-right .sub');if(tbody){let data=db.vehicles.filter(v=>(fleetStatus==='all'||(fleetStatus==='attention'?['overdue','soon'].includes(vehicleHealth(v)):v.status===fleetStatus))&&(`${v.id} ${v.plate} ${v.driver} ${v.make} ${v.model}`).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));tbody.innerHTML=data.map(vehicleRow).join('')||'<tr><td colspan="5" class="empty">No matching vehicles.</td></tr>';if(summary)summary.textContent=i18n.translate('Showing '+data.length+' of '+db.vehicles.length);i18n.localize(tbody)}}}
function csvCell(v){let s=String(v===null||v===undefined?'':v);return '"'+s.replace(/"/g,'""')+'"'}
function downloadCSV(name,rows){if(rows.length)rows[0]=rows[0].map(s=>i18n.translate(s));downloadText(name,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function downloadText(name,txt,mime){let blob=new Blob([txt],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function vehicleCSV(){let heads=['ID','Plate','Status','Make','Model','Year','VIN','Type','Driver','Branch','Department','Odometer km','Odometer date','Insurance expiry','Tax expiry','Inspection expiry','Registration expiry','Notes'];return [heads,...db.vehicles.map(v=>[v.id,v.plate,v.status,v.make,v.model,v.year,v.vin,v.type,v.driver,v.branch,v.department,v.currentOdometer,v.odometerDate,v.insuranceExpiry,v.taxExpiry,v.inspectionExpiry,v.registrationExpiry,v.notes])]}
function mileageCSV(){return [['Event ID','Vehicle ID','Reading date','Odometer km','Notes','Source'],...db.odometerLogs.map(l=>[l.id,l.vehicleId,l.date,l.odometer,l.notes,l.source])]}
function serviceCSV(){const heads=['Event ID','Vehicle ID','Category','Date','Odometer km','Cost THB (blank if unknown)','Garage','Description','Downtime days','Receipt reference','Source','Verified'];return [heads,...db.services.map(x=>[x.id,x.vehicleId,x.category,x.date,x.odometer,x.cost,x.vendor,x.description,x.downtimeDays,x.receipt,x.source,x.verified])]}
function reportCSV(){const e=reportsEvents();return [['Vehicle ID','License plate','Odometer km','Maintenance status','Service entries in selected period','Costed entries','Known cost THB','Partial cost/km THB','Missing priced entries'],...db.vehicles.map(v=>{let {rows,cost,kmValue}=vehicleExpenseStats(v,e);return [v.id,v.plate,v.currentOdometer,vehicleHealth(v),rows.length,cost.count,cost.count?cost.total:'',kmValue??'',rows.length-cost.count]})]}
function restoreBackup(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=async()=>{try{let parsed=JSON.parse(reader.result),data=parsed.data||parsed;if(!Array.isArray(data.vehicles)||!Array.isArray(data.services)||!Array.isArray(data.rules))throw Error('Missing required vehicle/service/rule arrays');if(!confirm(`Restore ${data.vehicles.length} vehicle records and ${data.services.length} service records? This replaces the shared database.`))return;data.downtime=data.downtime||[];data.odometerLogs=data.odometerLogs||[];data.issues=data.issues||[];data.metadata=data.metadata||{};data.config=data.config||{trackingStart:null};if(!await api('POST','/api/fleet/replace',{data}))return;setPage('dashboard');toast('Backup successfully restored')}catch(err){toast('Invalid backup file: '+err.message)}};reader.readAsText(file)};input.click()}
async function enableNotification(){if(!('Notification' in window)){toast('This browser does not support notifications');return}try{let allowed=await Notification.requestPermission();if(allowed!=='granted'){toast('Browser notification permission was not granted');return}let all=getAlerts().filter(a=>a.status==='overdue'||a.status==='soon'),n=new Notification('BP Fleet Management System',{body:all.length?(i18n.getLanguage()==='th'?`เกินกำหนด ${all.filter(x=>x.status==='overdue').length} รายการ · ใกล้ครบกำหนด ${all.filter(x=>x.status==='soon').length} รายการ กรุณาดูรายละเอียดในเมนูแจ้งเตือน`:`${all.filter(x=>x.status==='overdue').length} overdue and ${all.filter(x=>x.status==='soon').length} due-soon reminders. Open the Alerts tab for details.`):i18n.translate('No urgent maintenance reminders right now.'),icon:BRAND_LOGO});setTimeout(()=>n.close(),7000);toast('Browser notifications enabled for this open website')}catch(err){toast('Notifications may require HTTPS or browser permission')}}
document.addEventListener('click',clickHandler);document.addEventListener('change',changeHandler);document.addEventListener('input',inputHandler);document.addEventListener('submit',formSubmit);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}});
loadFleet();
})();
</script></body></html>
